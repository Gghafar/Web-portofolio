# Pengaturan Nginx untuk menyajikan hasil `next build` (folder out/).
server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Kompres file teks supaya lebih cepat dikirim ke browser.
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # File di /_next/static/ namanya berisi hash dan tidak pernah berubah
    # → browser boleh menyimpannya selama 1 tahun.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Endpoint kecil untuk mengecek "apakah container sehat?" (dipakai nanti di Step 4).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Halaman HTML: selalu cek versi terbaru.
    # /about → coba about, lalu about.html, lalu folder about/, kalau tidak ada → 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    # Pakai halaman 404 buatan Next.js.
    error_page 404 /404.html;
}
